[project]
name = "bci-sys"
version = "0.1.0"
description = "神经反馈训练原型：回放模拟实时（IT1）+ 离线 theta 检验（IT2）"
requires-python = ">=3.11"
dependencies = [
    "mne>=1.6",
    "numpy>=2.0",
    "scipy",
    "pandas",
    "matplotlib",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest",
    "websockets>=12",
    "wsproto>=1.2",
]

[project.scripts]
replay-monitor = "bci_sys.replay.cli:main"
qc-monitor = "bci_sys.replay.qc_cli:main"
theta-probe = "bci_sys.offline.cli:main"
feedback-loop = "bci_sys.replay.feedback_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bci_sys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
